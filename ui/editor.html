<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可编辑回复</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: var(--color-text-primary, #262626);
      --muted: var(--color-text-secondary, #737373);
      --line: var(--color-border-secondary, #dedede);
      --soft: var(--color-background-secondary, #f5f5f5);
      --action: var(--color-background-inverse, #262626);
      --on-action: var(--color-text-inverse, #fff);
      --focus: var(--color-ring-primary, #64748b);
      --error: var(--color-text-danger, #b42318);
      font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif);
      font-size: var(--font-text-md-size, 16px);
    }
    :root[data-theme="dark"] { color-scheme: dark; --text: var(--color-text-primary, #ececec); --muted: var(--color-text-secondary, #a3a3a3); --line: var(--color-border-secondary, #454545); --soft: var(--color-background-secondary, #292929); --action: var(--color-background-inverse, #ececec); --on-action: var(--color-text-inverse, #171717); --error: var(--color-text-danger, #ff9690); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --text: var(--color-text-primary, #ececec); --muted: var(--color-text-secondary, #a3a3a3); --line: var(--color-border-secondary, #454545); --soft: var(--color-background-secondary, #292929); --action: var(--color-background-inverse, #ececec); --on-action: var(--color-text-inverse, #171717); --error: var(--color-text-danger, #ff9690); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; background: transparent; color: var(--text); }
    main { width: 100%; padding: 4px 2px; }
    [hidden] { display: none !important; }
    #reply { min-height: 1.75em; line-height: 1.75; overflow-wrap: anywhere; caret-color: var(--text); user-select: text; }
    #reply:focus { outline: none; }
    #reply:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
    #reply > :first-child { margin-top: 0; }
    #reply > :last-child { margin-bottom: 0; }
    #reply p { margin: 0 0 1em; }
    #reply h1, #reply h2, #reply h3, #reply h4, #reply h5, #reply h6 { margin: 1.5em 0 .5em; line-height: 1.4; font-weight: 600; }
    #reply h1 { font-size: 1.5em; } #reply h2 { font-size: 1.25em; } #reply h3, #reply h4, #reply h5, #reply h6 { font-size: 1em; }
    #reply ul, #reply ol { padding-left: 1.5em; margin: 1em 0; } #reply li { margin: .25em 0; } #reply li > p { margin: .5em 0; }
    #reply blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--line); color: var(--muted); }
    #reply a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    #reply code { font-family: var(--font-mono, ui-monospace, "Cascadia Code", monospace); font-size: .875em; background: var(--soft); padding: .1em .25em; border-radius: 3px; }
    #reply pre { margin: 1em 0; padding: 1em; background: var(--soft); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #reply pre code { background: none; padding: 0; border-radius: 0; }
    #reply table { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 1em 0; font-size: .9375em; }
    #reply th, #reply td { padding: .5em .75em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    #reply th { font-weight: 600; } #reply hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
    .image-reference { color: var(--muted); border-bottom: 1px dashed var(--line); }
    #edit-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    button { font: inherit; font-size: .8125rem; min-height: 36px; padding: 6px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
    button:hover { background: var(--soft); color: var(--text); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    #save { background: var(--action); color: var(--on-action); }
    #notice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .75rem; color: var(--muted); }
    #status:not(:empty) { margin-top: 8px; } #status[data-kind="error"] { color: var(--error); }
    #notice button { padding-left: 0; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 480px) { #reply th, #reply td { padding: .5em; } button { min-height: 40px; } }
  </style>
</head>
<body>
  <main aria-label="可编辑回复">
    <article id="reply" contenteditable="false" tabindex="0" role="textbox" aria-multiline="true" aria-label="回复正文，点击可直接修改" aria-describedby="status" spellcheck="true"></article>
    <div id="edit-actions" hidden>
      <button id="cancel" type="button">取消</button>
      <button id="save" type="button" disabled>保存</button>
    </div>
    <div id="notice">
      <span id="status" role="status" aria-live="polite">正在加载正文…</span>
      <button id="load-draft" type="button" hidden>载入旧草稿</button>
      <button id="retry-notice" type="button" hidden>重试通知对话</button>
    </div>
  </main>
  <script src="../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script src="../node_modules/turndown/dist/turndown.js"></script>
  <script src="../node_modules/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
  <script src="rich-text.js"></script>
  <script src="editor.js"></script>
</body>
</html>
